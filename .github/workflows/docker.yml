name: Build and Push Docker Image

# 单一 workflow 覆盖所有场景：
#   - push main   → 构建 + 推送 ghcr (latest, latest-YYYYMMDD)，paths 过滤增量触发
#   - push tag v* → 构建 + 推送 ghcr (版本号, v版本号, latest)，全量触发（发布用）
#   - PR to main  → 仅构建测试，不推送，paths 过滤
# 注：paths 过滤仅对 branch push / PR 生效，tag push 忽略 paths（GitHub 限制）
on:
  push:
    branches:
      - main
    paths:
      - 'packages/mira-app-server/**'
      - 'packages/mira-app-core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docker.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/mira-app-server/**'
      - 'packages/mira-app-core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docker.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mira-app-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify workspace structure
      run: |
        echo "Checking workspace structure..."
        ls -la packages/
        ls -la packages/mira-app-server/Dockerfile

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Show Docker version
      run: |
        docker --version
        docker buildx version

    # PR 不需要登录、不推送
    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.SECERT }} # 不允许GITHUB_TOKEN为变量名称

    # 仅在需要推送时生成 tag 元数据（main / tag）
    - name: Extract metadata
      id: meta
      if: github.event_name != 'pull_request'
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          # main 和 tag 都打 latest
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          # 仅 main 打日期版
          type=raw,value=latest-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/main' }}
          # tag 自动产出 semver：v1.2.3 → 1.2.3, 1.2, 1
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./packages/mira-app-server/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate artifact attestation
      if: github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@v1
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true

    - name: Make package public
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      run: |
        # 使用 GitHub CLI 设置包为公开
        echo "Setting package visibility to public..."
        gh api \
          --method PATCH \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "/user/packages/container/${{ github.event.repository.name }}%2Fmira-app-server/visibility" \
          -f visibility='public' || echo "Package may already be public or requires manual setup"
      env:
        GITHUB_TOKEN: ${{ secrets.SECERT }}
