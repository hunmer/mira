name: Electron Build

# 触发条件：
#   - push main（paths 过滤）→ 增量 CI，构建测试但不发布
#   - push tag v*           → 正式发布，构建并上传 GitHub Release（全量，tag 不受 paths 限制）
# 注：main 推送时也构建产物但不应创建 release，job 内用 if 控制发布行为
on:
  push:
    branches:
      - main
    paths:
      - 'packages/mira-client/**'
      - 'packages/vue-masonry/**'
      - 'packages/mira-app-core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/electron.yml'
    tags:
      - 'v*'

permissions:
  contents: write  # 上传 release asset 需要

jobs:
  build:
    strategy:
      fail-fast: false  # 一个平台失败不影响另一个
      matrix:
        include:
          - os: windows-latest
            platform: win
            script: electron:build:win
          - os: macos-latest
            platform: mac
            script: electron:build:mac

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build workspace dependencies
      # mira-client 通过 workspace:* 引用以下包，它们的 dist 产物需先构建出来：
      #   - @hunmer/vue-masonry  → dist/style.css, dist/vue-masonry.js
      #   - mira-app-core        → dist/shared/sdk/*（MiraAPI.ts 引用）
      # 用 pnpm recursive 按依赖顺序构建这两个包
      run: pnpm --filter "@hunmer/vue-masonry" --filter "mira-app-core" build

    - name: Build & package (${{ matrix.platform }})
      working-directory: packages/mira-client
      env:
        # macOS 公证密钥（缺失时 notarize.js 会自动跳过，不阻断构建）
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Windows 代码签名证书（缺失则跳过签名）
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: pnpm run ${{ matrix.script }}

    - name: Upload artifacts to GitHub Release
      # 仅 tag 推送时发布；main 推送只做构建验证
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        # 只上传实际安装包，排除 latest.yml / blockmap 等元数据（按需调整）
        files: |
          packages/mira-client/build/*.exe
          packages/mira-client/build/*.dmg
          packages/mira-client/build/*.zip
          packages/mira-client/build/*.appx
          packages/mira-client/build/*.msi
        fail_on_unmatched_files: false
        generate_release_notes: true
