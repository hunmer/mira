name: Deploy Landing Page

# 仅版本标签或手动触发，避免普通文件变更自动运行。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install dependencies (landing-page 不在 workspace，需忽略 workspace 配置独立安装)
      working-directory: packages/landing-page
      run: pnpm install --no-frozen-lockfile --ignore-workspace

    - name: Build (验证构建是否通过)
      # main / tag 都跑构建，作为增量 CI 的验证
      working-directory: packages/landing-page
      run: pnpm run build

    - name: Install Vercel CLI
      if: startsWith(github.ref, 'refs/tags/')
      run: npm install -g vercel@latest

    - name: Deploy to Vercel (production)
      # 仅 tag 推送时部署；main 推送只做构建验证
      if: startsWith(github.ref, 'refs/tags/')
      working-directory: packages/landing-page
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LANDING_PROJECT_ID }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      run: |
        if [ -z "$VERCEL_TOKEN" ]; then
          echo "❌ VERCEL_TOKEN secret 未配置"
          exit 1
        fi
        vercel deploy --prod --yes --token "$VERCEL_TOKEN" --name mira-landing --cwd .
        echo "✅ 部署完成"
