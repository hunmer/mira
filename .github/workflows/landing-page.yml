name: Deploy Landing Page

# 仅在 push tag v* 时触发，部署 Next.js 到 Vercel（独立项目）
# 采用 prebuilt 模式：在 runner 本地构建（已验证 21/21 prerender 成功），
# 再把 .next 产物上传到 Vercel，避开 Vercel 端构建环境的 prerender bug
on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install dependencies (landing-page 不在 workspace，需忽略 workspace 配置独立安装)
      working-directory: packages/landing-page
      run: pnpm install --no-frozen-lockfile --ignore-workspace

    - name: Install Vercel CLI
      run: npm install -g vercel@latest

    - name: Pull Vercel project config (建立 .vercel 关联)
      working-directory: packages/landing-page
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LANDING_PROJECT_ID }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      run: |
        if [ -z "$VERCEL_TOKEN" ]; then
          echo "❌ VERCEL_TOKEN secret 未配置"
          exit 1
        fi
        # 拉取远端项目环境配置到本地（用于下一步本地 build）
        vercel link --yes --token "$VERCEL_TOKEN" --cwd .

    - name: Build locally with Vercel (产出 .vercel/output)
      # vercel build 在 runner 本地按 Vercel 同样的流程构建，
      # 但使用 runner 的 Node/环境（已验证 21/21 prerender 成功）
      working-directory: packages/landing-page
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: vercel build --yes --token "$VERCEL_TOKEN" --cwd .

    - name: Deploy prebuilt artifacts to Vercel (production)
      # 直接上传上一步构建好的产物，跳过 Vercel 端再次构建
      working-directory: packages/landing-page
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN" --cwd .
        echo "✅ 部署完成"
