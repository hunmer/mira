name: Electron Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Checkout procm-mcp SDK dependency
      uses: actions/checkout@v4
      with:
        repository: hunmer/procm-mcp
        path: procm-mcp

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Build procm-mcp SDK
      shell: bash
      run: |
        node -e "const fs=require('fs'); fs.mkdirSync('../procm-mcp/packages',{recursive:true}); fs.cpSync('procm-mcp/packages/procm-sdk','../procm-mcp/packages/procm-sdk',{recursive:true})"
        npm --prefix ../procm-mcp/packages/procm-sdk install --no-audit --no-fund
        npm --prefix ../procm-mcp/packages/procm-sdk run build

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build workspace dependencies
      run: pnpm --filter "@hunmer/vue-masonry" --filter "mira-app-core" build

    - name: Install runtime dependencies
      shell: powershell
      run: choco install ffmpeg imagemagick exiftool -y --no-progress

    - name: Build standalone server
      run: |
        pnpm --filter mira-app-server build
        pnpm --filter mira-app-server deploy --prod "${{ runner.temp }}\mira-server"

    - name: Build and package Windows
      working-directory: packages/mira-client
      env:
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: pnpm run electron:build:win

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mira-windows-${{ github.sha }}
        path: |
          packages/mira-client/build/*.exe
          packages/mira-client/build/*.msi
          packages/mira-client/build/*.zip
        if-no-files-found: error
        retention-days: 14

    - name: Assemble Windows release bundle
      env:
        BUNDLE_PLATFORM: windows
        SERVER_DIR: ${{ runner.temp }}\mira-server
        INSTALLER_DIR: packages/mira-client/build
        RELEASE_ARCHIVE: ${{ runner.temp }}\mira-windows-${{ github.ref_name || github.sha }}.zip
      run: |
        node scripts/assemble-release-bundle.mjs

    - name: Upload release bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: mira-windows-bundle-${{ github.sha }}
        path: ${{ runner.temp }}/mira-windows-*.zip
        if-no-files-found: error
        retention-days: 14

    - name: Upload artifacts to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          packages/mira-client/build/*.exe
          packages/mira-client/build/*.msi
          packages/mira-client/build/*.zip
          ${{ runner.temp }}/mira-windows-*.zip
        fail_on_unmatched_files: false
        generate_release_notes: true
