name: Electron macOS Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build workspace dependencies
      run: pnpm --filter "@hunmer/vue-masonry" --filter "mira-app-core" build

    - name: Install runtime dependencies
      run: brew install ffmpeg imagemagick exiftool

    - name: Build standalone server
      run: |
        pnpm --filter mira-app-server build
        pnpm --filter mira-app-server deploy --prod "${{ runner.temp }}/mira-server"

    - name: Build and package macOS
      working-directory: packages/mira-client
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: pnpm run electron:build:mac

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mira-macos-${{ github.sha }}
        path: |
          packages/mira-client/build/*.dmg
          packages/mira-client/build/*.zip
        if-no-files-found: error
        retention-days: 14

    - name: Assemble macOS release bundle
      env:
        BUNDLE_PLATFORM: macos
        SERVER_DIR: ${{ runner.temp }}/mira-server
        INSTALLER_DIR: packages/mira-client/build
        RELEASE_ARCHIVE: ${{ runner.temp }}/mira-macos-${{ github.ref_name || github.sha }}.zip
      run: |
        node scripts/assemble-release-bundle.mjs

    - name: Upload release bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: mira-macos-bundle-${{ github.sha }}
        path: ${{ runner.temp }}/mira-macos-*.zip
        if-no-files-found: error
        retention-days: 14

    - name: Upload artifacts to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          packages/mira-client/build/*.dmg
          packages/mira-client/build/*.zip
          ${{ runner.temp }}/mira-macos-*.zip
        fail_on_unmatched_files: false
        generate_release_notes: true
