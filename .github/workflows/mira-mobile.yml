name: Mira Mobile Build

on:
  push:
    branches:
      - main
    paths:
      - 'packages/mira_mobile/**'
      - '.github/workflows/mira-mobile.yml'
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'
  MOBILE_DIR: packages/mira_mobile

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Install dependencies
      working-directory: ${{ env.MOBILE_DIR }}
      run: flutter pub get

    - name: Analyze
      working-directory: ${{ env.MOBILE_DIR }}
      run: flutter analyze --no-fatal-infos --no-fatal-warnings

    - name: Run unit tests
      working-directory: ${{ env.MOBILE_DIR }}
      run: >-
        flutter test
        test/src/providers/file_filter_provider_test.dart
        test/src/utils/media_utils_test.dart
        test/mira_sdk/models/file_test.dart

  android:
    needs: validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Install dependencies
      working-directory: ${{ env.MOBILE_DIR }}
      run: flutter pub get

    - name: Resolve build version
      id: version
      shell: bash
      working-directory: ${{ env.MOBILE_DIR }}
      run: |
        build_name="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          build_name="${GITHUB_REF_NAME#v}"
        fi
        echo "name=${build_name}" >> "${GITHUB_OUTPUT}"

    - name: Generate temporary Android signing key
      shell: bash
      working-directory: ${{ env.MOBILE_DIR }}
      run: |
        signing_password="$(openssl rand -hex 24)"
        keytool -genkeypair -v \
          -noprompt \
          -keystore android/app/release.jks \
          -alias mira-ci \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "${signing_password}" \
          -keypass "${signing_password}" \
          -dname "CN=Mira Mobile CI, O=Mira, C=CN"
        {
          echo "storePassword=${signing_password}"
          echo "keyPassword=${signing_password}"
          echo "keyAlias=mira-ci"
          echo "storeFile=release.jks"
        } > android/app/key.properties

    - name: Build signed Android APK
      working-directory: ${{ env.MOBILE_DIR }}
      run: >-
        flutter build apk --release
        --build-name "${{ steps.version.outputs.name }}"
        --build-number "${{ github.run_number }}"

    - name: Prepare Android artifact
      shell: bash
      working-directory: ${{ env.MOBILE_DIR }}
      run: |
        mkdir -p artifacts
        cp build/app/outputs/flutter-apk/app-release.apk \
          "artifacts/mira-mobile-${{ steps.version.outputs.name }}-android.apk"

    - name: Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: mira-mobile-android-${{ github.sha }}
        path: packages/mira_mobile/artifacts/*.apk
        if-no-files-found: error
        retention-days: 14

  ios:
    needs: validate
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true

    - name: Install dependencies
      working-directory: ${{ env.MOBILE_DIR }}
      run: flutter pub get

    - name: Resolve build version
      id: version
      working-directory: ${{ env.MOBILE_DIR }}
      run: |
        build_name="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          build_name="${GITHUB_REF_NAME#v}"
        fi
        echo "name=${build_name}" >> "${GITHUB_OUTPUT}"

    - name: Build unsigned iOS app
      working-directory: ${{ env.MOBILE_DIR }}
      run: >-
        flutter build ios --release --no-codesign
        --build-name "${{ steps.version.outputs.name }}"
        --build-number "${{ github.run_number }}"

    - name: Prepare iOS artifact
      working-directory: ${{ env.MOBILE_DIR }}
      run: |
        mkdir -p artifacts
        ditto -c -k --sequesterRsrc --keepParent \
          build/ios/iphoneos/Runner.app \
          "artifacts/mira-mobile-${{ steps.version.outputs.name }}-ios-unsigned.zip"

    - name: Upload iOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: mira-mobile-ios-${{ github.sha }}
        path: packages/mira_mobile/artifacts/*.zip
        if-no-files-found: error
        retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - android
      - ios
    runs-on: ubuntu-latest

    steps:
    - name: Download mobile artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: mira-mobile-*-${{ github.sha }}
        path: release-artifacts
        merge-multiple: true

    - name: Upload artifacts to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-artifacts/*
        fail_on_unmatched_files: true
        generate_release_notes: true
