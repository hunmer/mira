<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mira-plugin-ui · CDN 引入验证</title>
  <!-- 真实 CDN 场景：
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://your-cdn/mira-plugin-ui/mira-plugin-ui.css">
    <script src="https://your-cdn/mira-plugin-ui/mira-plugin-ui.umd.js"></script>
    下面使用本地 dist 产物验证同样的引入方式（dist 目录由 npm run build 生成） -->
  <script src="../node_modules/vue/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="../dist/mira-plugin-ui.css">
  <script src="../dist/mira-plugin-ui.umd.js"></script>
  <style>
    /* 页面自身布局样式不依赖 tailwind：dist CSS 只包含组件所需样式 */
    [v-cloak] { display: none; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .page { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
    .page h1 { font-size: 22px; margin: 0 0 4px; }
    .page .sub { color: #666; font-size: 13px; margin-bottom: 32px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0 40px; }
    .result { margin-top: 12px; padding: 10px 12px; background: #f5f5f5; border-radius: 8px; font: 12px/1.6 ui-monospace, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="app" v-cloak class="page">
    <h1>mira-plugin-ui · CDN 引入验证</h1>
    <p class="sub">本页面未使用任何构建工具，直接通过 script/link 引入 dist 产物展示组件。</p>

    <h3>Button</h3>
    <div class="row">
      <m-button>默认</m-button>
      <m-button variant="outline">描边</m-button>
      <m-button variant="secondary">次要</m-button>
      <m-button variant="ghost">幽灵</m-button>
    </div>

    <h3>SaveLocationDialog</h3>
    <div class="row">
      <m-button @click="open = true">保存文档到…</m-button>
    </div>
    <div v-if="saved" class="result">{{ saved }}</div>

    <save-location-dialog
      v-model:open="open"
      :libraries="libraries"
      :folders="folders"
      initial-library-id="1"
      initial-file-name="CDN 文档"
      @save="onSave"
    />
  </div>

  <script>
    const { createApp } = Vue
    const app = createApp({
      data: () => ({
        open: false,
        saved: '',
        libraries: [
          { id: 1, name: '我的素材库' },
          { id: 2, name: '设计灵感' },
        ],
        folders: [
          { id: 101, title: '文档' },
          { id: 102, title: '笔记' },
        ],
      }),
      methods: {
        onSave (location) { this.saved = JSON.stringify(location, null, 2) },
      },
    })
    // UMD 全局导出：具名组件 + 默认 Vue plugin（exports: 'named'）
    app.use(MiraPluginUI.default)
    app.mount('#app')
  </script>
</body>
</html>
