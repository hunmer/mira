<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mira 设备配对</title>
<!-- mira-plugin-ui 自包含 dist：组件 JS(UMD) + 编译好的完整 CSS(含 shadcn token)，
     免构建消费详见 docs/plugin-ui-source-consumption.md（本页无构建链路，直接用 dist + 全量 CSS，
     自有标记只用 dist CSS 中已存在的工具类） -->
<link rel="stylesheet" href="/static/vendor/mira-plugin-ui.css">
<script>
  // 首帧前应用主题（避免亮暗闪烁）：localStorage 优先，缺省跟随系统
  (function () {
    var saved = localStorage.getItem('mira-pair-theme');
    if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
<style>
  /* 覆盖组件库默认 token：默认 primary 为蓝紫(hue 260)，本页改绿色(配对/连接语义)，其余 token 沿用 */
  :root {
    --primary: oklch(0.596 0.13 163);
    --ring: oklch(0.708 0.1 163);
    --sidebar-primary: oklch(0.596 0.13 163);
  }
  .dark {
    --primary: oklch(0.696 0.14 163);
    --ring: oklch(0.556 0.1 163);
    --sidebar-primary: oklch(0.696 0.14 163);
  }
  html { height: 100% }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
  }

  /* ---- 大小屏布局（media query 走页面自有样式，不依赖 dist 工具类） ---- */
  /* 大屏：对话框固定宽度，展示更多内容；小屏：占满可用宽度 */
  .page { width: 100%; }
  @media (min-width: 1024px) { .page { width: 960px; } }

  /* 内容区固定高度：状态切换（等待/列表/下载）时对话框尺寸稳定不跳动 */
  .tab-body { min-height: 280px; display: flex; flex-direction: column; }
  .list-scroll { max-height: 260px; }
  @media (min-width: 640px) {
    .tab-body { min-height: 380px; }
    .list-scroll { max-height: 360px; }
  }
  @media (min-width: 1024px) {
    .tab-body { min-height: 480px; }
    .list-scroll { max-height: 460px; }
  }

  /* 发送区双栏：小屏纵向堆叠，>=640px 横向（左设备列表 / 右信息+操作侧栏） */
  .send-cols { flex-direction: column; }
  .send-side { border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 16px; }
  @media (min-width: 640px) {
    .send-cols { flex-direction: row; flex: 1; min-height: 0; }
    .send-devices { overflow-y: auto; }
    .send-side { width: 260px; border-top: none; margin-top: 0; padding-top: 0; border-left: 1px dashed var(--border); padding-left: 16px; }
  }

  /* 小屏：卡片与页面留白收紧 */
  @media (max-width: 479px) {
    body { padding: 8px; }
    .page-inner { padding: 16px; }
  }
</style>
</head>
<body class="bg-background text-foreground">
<div id="app"></div>

<!-- Vue 全量构建(含模板编译器, 全局 Vue) + 组件库 UMD(全局 MiraPluginUI) -->
<script src="/static/vendor/vue.global.prod.js"></script>
<script src="/static/vendor/mira-plugin-ui.umd.js"></script>

<script type="module">
import { MiraClient } from '/static/sdk/mira-sdk.esm.mjs';

const { createApp, reactive, ref, computed } = Vue;

const qs = new URLSearchParams(location.search);
const token = qs.get('token');
const libraryId = qs.get('libraryId');
const wsUrlParam = qs.get('ws');
const fromClientId = qs.get('from'); // 发起配对的桌面端 clientId（用于反向推送）

/* ---------- 主题 / 语言（localStorage 持久化，默认跟随系统/浏览器） ---------- */
const THEME_KEY = 'mira-pair-theme';
const theme = ref(localStorage.getItem(THEME_KEY)
  || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
function applyTheme(value) {
  theme.value = value;
  localStorage.setItem(THEME_KEY, value);
  document.documentElement.classList.toggle('dark', value === 'dark');
}
function toggleTheme() { applyTheme(theme.value === 'dark' ? 'light' : 'dark') }

const messages = {
  'zh-CN': {
    title: 'Mira 设备配对',
    connecting: '正在连接服务器…',
    connected: '已连接（{v}）· 等待接收',
    paramMissing: '配对参数缺失，请重新扫码',
    connFailed: '连接失败：{msg}',
    libraryNotFound: '素材库 {id} 不存在，请重新扫码',
    disconnected: '连接已断开，请重新扫码配对',
    incomingFrom: '收到来自「{from}」的文件',
    tabReceive: '接收文件',
    tabSend: '发送文件',
    receivedCount: '接收到 {n} 个文件：',
    untitled: '未命名',
    downloaded: '已下载 ✓',
    downloadingBtn: '下载中…',
    retry: '重试下载',
    acceptZip: '接收并下载（ZIP 打包）',
    accept: '接收并下载',
    downloadDone: '下载完成，已保存到浏览器默认下载目录',
    downloadFailed: '下载失败：{msg}',
    waitingTitle: '等待接收',
    waitingDesc: '其他设备发送的文件会出现在这里，保持此页面打开',
    server: '服务器',
    library: '素材库',
    pickAndSend: '选择文件并发送',
    sendingBtn: '发送中…',
    pickDeviceFirst: '请先选择要发送到的设备',
    sendHint: '文件会上传到素材库并通知对方接收',
    uploading: '上传中 {a}/{b}',
    sent: '已发送 {n} 个文件，等待对方接收',
    sendFailed: '发送失败：{msg}',
    noFilesUploaded: '没有文件上传成功',
    pairPhone: '配对设备 · 手机',
    pairBrowser: '配对设备 · 浏览器',
    toggleTheme: '切换主题',
    toggleLang: '切换语言',
  },
  'en-US': {
    title: 'Mira Pairing',
    connecting: 'Connecting to server…',
    connected: 'Connected ({v}) · Waiting',
    paramMissing: 'Missing pairing parameters, please rescan the QR code',
    connFailed: 'Connection failed: {msg}',
    libraryNotFound: 'Library {id} not found, please rescan',
    disconnected: 'Disconnected, please rescan to pair again',
    incomingFrom: 'Files from "{from}"',
    tabReceive: 'Receive',
    tabSend: 'Send',
    receivedCount: '{n} file(s) received:',
    untitled: 'Untitled',
    downloaded: 'Downloaded ✓',
    downloadingBtn: 'Downloading…',
    retry: 'Retry download',
    acceptZip: 'Accept & Download (ZIP)',
    accept: 'Accept & Download',
    downloadDone: 'Done. Saved to your browser\'s download folder',
    downloadFailed: 'Download failed: {msg}',
    waitingTitle: 'Waiting',
    waitingDesc: 'Files sent from other devices will appear here. Keep this page open',
    server: 'Server',
    library: 'Library',
    pickAndSend: 'Pick files & send',
    sendingBtn: 'Sending…',
    pickDeviceFirst: 'Select a target device first',
    sendHint: 'Files are uploaded to the library and the recipient is notified',
    uploading: 'Uploading {a}/{b}',
    sent: 'Sent {n} file(s), waiting for the recipient',
    sendFailed: 'Send failed: {msg}',
    noFilesUploaded: 'No files were uploaded',
    pairPhone: 'Paired device · Phone',
    pairBrowser: 'Paired device · Browser',
    toggleTheme: 'Toggle theme',
    toggleLang: 'Toggle language',
  },
};
const LANG_KEY = 'mira-pair-lang';
const lang = ref(localStorage.getItem(LANG_KEY)
  || (navigator.language?.startsWith('zh') ? 'zh-CN' : 'en-US'));
function toggleLang() {
  lang.value = lang.value === 'zh-CN' ? 'en-US' : 'zh-CN';
  localStorage.setItem(LANG_KEY, lang.value);
}
function t(key, params) {
  let s = messages[lang.value]?.[key] ?? messages['zh-CN'][key] ?? key;
  if (params) for (const [k, v] of Object.entries(params)) s = s.replaceAll(`{${k}}`, String(v));
  return s;
}

const state = reactive({
  status: 'wait', // wait | ok | err
  statusText: t('connecting'),
  pulse: true,
  share: null, // 收到的 mira-share 消息
  downloading: false,
  downloaded: false,
  downloadFailed: false,
  dl: { showBar: false, percent: 0, text: '', error: false },
  selfId: '', // 本页 WS clientId（DeviceListPicker 排除自身用）
  sending: false,
  send: { showBar: false, percent: 0, text: '', error: false },
});

const fileInputEl = ref(null);
const selectedDevice = ref(null); // 发送目标 clientId（DeviceListPicker 选中项）
const activeTab = ref('receive'); // receive | send

// 设备列表数据服务：SDK devices().getByLibrary（返回 Device[]，结构兼容 DeviceListItem）
const deviceServices = {
  async listDevices(libId) {
    if (!client) return [];
    try {
      return await client.devices().getByLibrary(libId || libraryId || 'default');
    } catch (err) {
      // 库不存在按空列表处理（组件显示空态文案），其余错误照常抛给组件展示
      if (err?.status === 404) return [];
      throw err;
    }
  },
};

// 列表回来时预选 QR 中的 from 设备（每次轮询幂等执行）
function onDevices(devices) {
  if (!selectedDevice.value && fromClientId && devices.some((d) => d.clientId === fromClientId)) {
    selectedDevice.value = fromClientId;
  }
}

const statusClass = computed(() => ({
  wait: 'bg-muted text-muted-foreground',
  ok: 'bg-primary/10 text-primary',
  err: 'bg-destructive/10 text-destructive',
}[state.status]));

const acceptLabel = computed(() => {
  if (state.downloaded) return t('downloaded');
  if (state.downloading) return t('downloadingBtn');
  if (state.downloadFailed) return t('retry');
  const files = state.share?.files || [];
  return files.length > 1 && state.share?.ticketUrl ? t('acceptZip') : t('accept');
});

/** 接收文件 Attachment 状态：未开始=idle(虚线) 下载中=uploading(微光) 完成=done 失败=error */
const shareAttachState = computed(() => {
  if (state.downloaded) return 'done';
  if (state.downloadFailed) return 'error';
  if (state.downloading) return 'uploading';
  return 'idle';
});

function setStatus(status, text, pulse) {
  state.status = status;
  state.statusText = text;
  state.pulse = pulse;
}

function formatSize(n) {
  if (!n) return '';
  if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n > 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}

let client = null;
let selfId = '';

if (!token || !libraryId || !wsUrlParam) {
  setStatus('err', t('paramMissing'), false);
} else {
  main().catch((err) => {
    console.error(err);
    setStatus('err', t('connFailed', { msg: err?.message || err }), false);
  });
}

async function main() {
  // 静态页与 API 同源部署，直接用当前 origin 作为服务地址
  client = new MiraClient(location.origin);
  client.setToken(token);

  // token 认证验证（失败会抛 401）
  const info = await client.system().getSystemInfo();

  // 验证素材库存在（无效 libraryId 时设备列表/上传接口都会 404，提前给出明确提示）
  try {
    await client.devices().getByLibrary(libraryId);
  } catch (err) {
    if (err?.status === 404) throw new Error(t('libraryNotFound', { id: libraryId }));
    throw err;
  }

  // 稳定 clientId：持久化到 localStorage，刷新/重开后用相同 id 重连（server 对同 id 重连会顶替旧连接）。
  // 发送端的传输记录按 clientId 记忆目标设备，id 稳定后「重新发送」才不会 Device not found
  const SELF_ID_KEY = 'mira-pair-client-id';
  selfId = localStorage.getItem(SELF_ID_KEY) || `pair_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
  localStorage.setItem(SELF_ID_KEY, selfId);
  state.selfId = selfId;
  const ws = client.websocket(0, {
    url: wsUrlParam,
    clientId: selfId,
    libraryId,
    token,
  });
  // SDK 的 websocket() 构造后需要 start() 建立连接
  await ws.start();
  setStatus('ok', t('connected', { v: info?.data?.version || info?.version || 'ok' }), true);

  ws.on('disconnected', () => {
    if (!state.share) setStatus('err', t('disconnected'), false);
  });

  // 设备消息通过 eventName=admin_message 下发，message 体在 data.message
  ws.bind('admin_message', (data) => {
    const msg = data?.message || data;
    if (msg?.type === 'mira-share') renderShare(msg);
  });
}

function renderShare(msg) {
  state.share = { ...msg, files: msg.files || [] };
  activeTab.value = 'receive';
  setStatus('ok', t('incomingFrom', { from: msg.fromLabel || msg.from || '?' }), false);
}

async function downloadShare() {
  const msg = state.share;
  const files = msg?.files || [];
  if (!client || files.length === 0 || state.downloading) return;

  // 回传接收进度/状态给发送端（mira-share-ack；简单节流：变化 <5% 不发，终态必发）
  let lastAckP = -1;
  const sendAck = (ackState, p = 0) => {
    if (!client || !msg?.from || !msg?.id) return;
    if (ackState === 'receiving') {
      if (p - lastAckP < 0.05 && p < 1) return;
      lastAckP = p;
    }
    client.devices().sendMessage(msg.from, msg.libraryId || libraryId, {
      type: 'mira-share-ack',
      shareId: msg.id,
      state: ackState,
      percent: p,
    }).catch(() => {});
  };

  state.downloading = true;
  state.downloaded = false;
  state.downloadFailed = false;
  state.dl = { showBar: true, percent: 0, text: '', error: false };
  const setProgress = (p, text) => {
    state.dl.percent = Math.round(p * 100);
    if (text) state.dl.text = text;
    sendAck('receiving', p);
  };
  try {
    // 优先一次性票据（免 token；单文件原文件 / 多文件 ZIP）；缺票据时回退直链/打包接口
    if (msg.ticketUrl) {
      const blob = await fetchBlob(reachableUrl(msg.ticketUrl), setProgress);
      saveBlob(blob, files.length === 1 ? (files[0].name || 'mira-file') : `mira-share-${Date.now()}.zip`);
    } else if (files.length === 1 && files[0].url) {
      // 单文件：直接走 HTTP 直连链下载
      const blob = await fetchBlob(reachableUrl(files[0].url), setProgress);
      saveBlob(blob, files[0].name || 'mira-file');
    } else {
      // 多文件：服务端 ZIP 打包（POST /api/fs/download，走 Authorization 认证）
      // ids 优先（服务端权威解析）；paths 兜底（反向发送场景上传返回的是绝对路径）
      const paths = files.map((f) => f.path).filter(Boolean);
      const ids = files.map((f) => f.id).filter(Boolean);
      const blob = await fetchBlobWithBody(`${location.origin}/api/fs/download`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ libraryId: msg.libraryId || libraryId, ids, paths }),
      }, setProgress);
      saveBlob(blob, `mira-share-${Date.now()}.zip`);
    }
    setProgress(1, t('downloadDone'));
    state.downloaded = true;
    sendAck('done', 1);
  } catch (err) {
    console.error(err);
    setProgress(0, t('downloadFailed', { msg: err?.message || err }));
    state.downloadFailed = true;
    state.dl.error = true;
    sendAck('failed');
  } finally {
    state.downloading = false;
  }
}

// 消息中的链接是发送端视角（可能是 127.0.0.1），替换成当前页面主机保证可达
function reachableUrl(url) {
  try {
    const parsed = new URL(url, location.origin);
    parsed.protocol = location.protocol === 'https:' ? 'https:' : parsed.protocol;
    parsed.host = location.host;
    return parsed.toString();
  } catch {
    return url;
  }
}

function onPickFiles(e) {
  sendBackToDesktop(e.target.files);
}

async function sendBackToDesktop(fileList) {
  const target = selectedDevice.value;
  if (!fileList || fileList.length === 0 || !client || !target || state.sending) return;
  const files = Array.from(fileList);
  state.sending = true;
  state.send = { showBar: true, percent: 0, text: t('uploading', { a: 0, b: files.length }), error: false };
  try {
    const uploaded = [];
    for (let i = 0; i < files.length; i++) {
      const res = await client.files().upload({
        libraryId,
        files: [files[i]],
        clientId: selfId,
        onUploadProgress: (e) => {
          if (e.total) state.send.percent = Math.round(((i + e.loaded / e.total) / files.length) * 100);
        },
      });
      const results = res?.results || [];
      for (const r of results) {
        if (!r?.success) continue;
        const id = r.result?.id ?? r.result?.fileId;
        if (id == null) continue;
        uploaded.push({
          id: String(id),
          name: r.result?.name || r.result?.title || r.file || files[i].name,
          path: r.result?.path,
          size: r.result?.size ?? files[i].size,
          url: `${location.origin}/api/files/file/${encodeURIComponent(libraryId)}/${encodeURIComponent(id)}${token ? '?token=' + encodeURIComponent(token) : ''}`,
        });
      }
      state.send.text = t('uploading', { a: i + 1, b: files.length });
    }
    if (uploaded.length === 0) throw new Error(t('noFilesUploaded'));
    await client.devices().sendMessage(target, libraryId, {
      type: 'mira-share',
      id: `share_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      from: selfId,
      fromLabel: /Android|iPhone|iPad/i.test(navigator.userAgent) ? t('pairPhone') : t('pairBrowser'),
      libraryId,
      files: uploaded,
    });
    state.send.percent = 100;
    state.send.text = t('sent', { n: uploaded.length });
  } catch (err) {
    console.error(err);
    state.send.text = t('sendFailed', { msg: err?.message || err });
    state.send.error = true;
  } finally {
    state.sending = false;
    if (fileInputEl.value) fileInputEl.value.value = '';
  }
}

function fetchBlob(url, onProgress) {
  return fetchBlobWithBody(url, {}, onProgress);
}

function fetchBlobWithBody(url, init, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open(init.method || 'GET', url);
    for (const [k, v] of Object.entries(init.headers || {})) xhr.setRequestHeader(k, v);
    xhr.responseType = 'blob';
    xhr.onprogress = (e) => { if (e.lengthComputable) onProgress?.(e.loaded / e.total); };
    xhr.onload = () => xhr.status >= 200 && xhr.status < 300
      ? resolve(xhr.response)
      : reject(new Error('HTTP ' + xhr.status));
    xhr.onerror = () => reject(new Error('network error'));
    xhr.send(init.body || null);
  });
}

function saveBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

// lucide 图标(stroke 风格),内联避免额外请求
const icon = (cls, paths) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${paths}</svg>`;
const icons = {
  phone: icon('size-5', '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>'),
  file: icon('size-4', '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>'),
  upload: icon('size-4', '<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/>'),
  sun: icon('size-4', '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>'),
  moon: icon('size-4', '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'),
};

const app = createApp({
  setup() {
    return {
      state, libraryId, activeTab, fileInputEl, selectedDevice, deviceServices, onDevices,
      statusClass, acceptLabel, shareAttachState, formatSize, downloadShare, onPickFiles,
      icons, t, theme, toggleTheme, lang, toggleLang,
      phoneIcon: icon('size-6', '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>'),
      origin: location.origin,
    };
  },
  template: `
  <div class="page bg-card text-card-foreground w-full rounded-xl border shadow-sm">
    <div class="page-inner flex flex-col gap-4 p-6">
      <div class="flex items-center gap-2">
        <span class="text-primary" v-html="icons.phone"></span>
        <h1 class="flex-1 min-w-0 truncate text-lg font-semibold">{{ t('title') }}</h1>
        <!-- 语言 / 主题切换 -->
        <button type="button" class="flex h-8 w-8 items-center justify-center rounded-lg text-muted-foreground transition-colors cursor-pointer hover:bg-muted hover:text-foreground text-xs font-medium"
          :title="t('toggleLang')" @click="toggleLang">{{ lang === 'zh-CN' ? 'EN' : '中' }}</button>
        <button type="button" class="flex h-8 w-8 items-center justify-center rounded-lg text-muted-foreground transition-colors cursor-pointer hover:bg-muted hover:text-foreground"
          :title="t('toggleTheme')" @click="toggleTheme">
          <span v-html="theme === 'dark' ? icons.sun : icons.moon"></span>
        </button>
      </div>

      <div class="flex items-center gap-2 rounded-lg p-2.5 text-sm" :class="statusClass">
        <span class="size-2 shrink-0 rounded-full bg-current" :class="state.pulse && 'animate-pulse'"></span>
        <span class="min-w-0 flex-1">{{ state.statusText }}</span>
      </div>

      <Tabs :model-value="activeTab" class="flex w-full min-w-0 flex-col gap-4" @update:model-value="activeTab = $event">
        <TabsList class="grid w-full grid-cols-2">
          <TabsTrigger value="receive" class="gap-1.5">
            {{ t('tabReceive') }}
            <span v-if="state.share" class="size-2 rounded-full bg-primary"></span>
          </TabsTrigger>
          <TabsTrigger value="send">{{ t('tabSend') }}</TabsTrigger>
        </TabsList>

        <!-- 接收：等待其他设备推送 / 下载 -->
        <TabsContent value="receive" class="mt-0 w-full min-w-0">
          <div class="tab-body">
            <div v-if="state.share" class="flex flex-col gap-3">
              <p class="text-sm font-medium">{{ t('receivedCount', { n: state.share.files.length }) }}</p>
              <div class="list-scroll flex flex-col gap-2 overflow-y-auto p-1">
                <Attachment v-for="(f, i) in state.share.files" :key="i" :state="shareAttachState" size="sm" class="w-full">
                  <AttachmentMedia variant="icon">
                    <span class="text-muted-foreground" v-html="icons.file"></span>
                  </AttachmentMedia>
                  <AttachmentContent>
                    <AttachmentTitle :title="f.name">{{ f.name || t('untitled') }}</AttachmentTitle>
                    <AttachmentDescription>{{ formatSize(f.size) }}</AttachmentDescription>
                  </AttachmentContent>
                </Attachment>
              </div>
              <Button :disabled="state.downloading || state.downloaded" @click="downloadShare">{{ acceptLabel }}</Button>
              <Progress v-if="state.dl.showBar" :model-value="state.dl.percent" />
              <p v-if="state.dl.text" class="text-xs text-center" :class="state.dl.error ? 'text-destructive' : 'text-muted-foreground'">{{ state.dl.text }}</p>
            </div>

            <Empty v-else-if="state.status === 'ok'" class="flex-1">
              <EmptyHeader>
                <EmptyMedia variant="icon">
                  <span v-html="phoneIcon"></span>
                </EmptyMedia>
                <EmptyTitle>{{ t('waitingTitle') }}</EmptyTitle>
                <EmptyDescription>{{ t('waitingDesc') }}</EmptyDescription>
              </EmptyHeader>
            </Empty>
          </div>
        </TabsContent>

        <!-- 发送：左设备列表 / 右信息+操作侧栏（小屏纵向堆叠） -->
        <TabsContent value="send" class="mt-0 w-full min-w-0">
          <div class="tab-body">
            <div class="send-cols flex min-w-0 gap-4">
              <div class="send-devices min-w-0 flex-1">
                <DeviceListPicker v-model:selected="selectedDevice" :services="deviceServices" :library-id="libraryId" :self-client-id="state.selfId" @devices="onDevices" />
              </div>

              <div class="send-side flex w-full shrink-0 flex-col gap-3">
                <!-- 服务器/素材库信息卡 -->
                <div class="bg-muted flex flex-col gap-1 rounded-lg border p-3 text-xs">
                  <span class="text-muted-foreground">{{ t('server') }}</span>
                  <span class="font-mono break-all">{{ origin }}</span>
                  <span class="text-muted-foreground mt-1">{{ t('library') }}</span>
                  <span class="font-mono break-all">{{ libraryId || '—' }}</span>
                </div>

                <input ref="fileInputEl" type="file" multiple class="hidden" @change="onPickFiles" />
                <Button variant="outline" :disabled="state.sending || !selectedDevice" @click="fileInputEl?.click()">
                  {{ state.sending ? t('sendingBtn') : t('pickAndSend') }}
                </Button>
                <Progress v-if="state.send.showBar" :model-value="state.send.percent" />
                <p v-if="state.send.text" class="text-xs" :class="state.send.error ? 'text-destructive' : 'text-muted-foreground'">{{ state.send.text }}</p>
                <p v-else-if="!selectedDevice" class="text-muted-foreground text-center text-xs">{{ t('pickDeviceFirst') }}</p>
                <p class="text-muted-foreground text-xs">{{ t('sendHint') }}</p>
              </div>
            </div>
          </div>
        </TabsContent>
      </Tabs>
    </div>
  </div>`,
});

app.use(MiraPluginUI.default);
app.mount('#app');
</script>
</body>
</html>
