const wsUrlParam = qs.get('ws');

/* ---------- 主题 / 语言（localStorage 持久化，默认跟随系统/浏览器） ---------- */

const messages = {

    pickDeviceFirst: 'Select a target device first',

    dropHint: 'Drop files here, or click to pick',

    sent: 'Sent {n} file(s), waiting for the recipient',
    sendFailed: 'Send failed: {msg}',
    noFilesUploaded: 'No files were uploaded',
    acceptTimeout: 'Recipient did not accept in time, transfer cancelled',
    connLost: 'Connection lost, transfer aborted',
    stallTimeout: 'Timed out waiting for data, stream interrupted',
    transferDone: 'Received by the recipient',
    pairPhone: 'Paired device · Phone',
    pairBrowser: 'Paired device · Browser',
    toggleTheme: 'Toggle theme',
    toggleLang: 'Toggle language',
  },
};
const LANG_KEY = 'mira-pair-lang';
const lang = ref(localStorage.getItem(LANG_KEY)
  || (navigator.language?.startsWith('zh') ? 'zh-CN' : 'en-US'));
function toggleLang() {
  lang.value = lang.value === 'zh-CN' ? 'en-US' : 'zh-CN';
  localStorage.setItem(LANG_KEY, lang.value);
}
function t(key, params) {
  let s = messages[lang.value]?.[key] ?? messages['zh-CN'][key] ?? key;
  if (params) for (const [k, v] of Object.entries(params)) s = s.replaceAll(`{${k}}`, String(v));
  return s;
}

const state = reactive({
  status: 'wait', // wait | ok | err
  statusText: t('connecting'),
  pulse: true,
  share: null, // 收到的 mira-share 消息
  downloading: false,
  downloaded: false,
  downloadFailed: false,
  dl: { showBar: false, percent: 0, text: '', error: false },
  selfId: '', // 本页 WS clientId（DeviceListPicker 排除自身用）
  sending: false,
  send: { showBar: false, percent: 0, text: '', error: false },
});

const stagedFiles = ref([]); // Dropzone 暂存的本地文件（二进制直传，不上传素材库）
const selectedDevice = ref(null); // 发送目标 clientId（DeviceListPicker 选中项）
const activeTab = ref('receive'); // receive | send

// 设备列表数据服务：SDK devices().getByLibrary（返回 Device[]，结构兼容 DeviceListItem）
const deviceServices = {
  async listDevices(libId) {
    if (!client) return [];
    try {
      return await client.devices().getByLibrary(libId || libraryId || 'default');
    } catch (err) {
      // 库不存在按空列表处理（组件显示空态文案），其余错误照常抛给组件展示
      if (err?.status === 404) return [];
      throw err;
    }
  },
};

// 列表回来时预选 QR 中的 from 设备（每次轮询幂等执行）
function onDevices(devices) {
  if (!selectedDevice.value && fromClientId && devices.some((d) => d.clientId === fromClientId)) {
    selectedDevice.value = fromClientId;
  }
}

const statusClass = computed(() => ({
  wait: 'bg-muted text-muted-foreground',
  ok: 'bg-primary/10 text-primary',
  err: 'bg-destructive/10 text-destructive',
}[state.status]));

const acceptLabel = computed(() => {
  if (state.downloaded) return t('downloaded');
  if (state.downloading) return t('downloadingBtn');
  if (state.downloadFailed) return t('retry');
  const files = state.share?.files || [];
  return files.length > 1 && state.share?.ticketUrl ? t('acceptZip') : t('accept');
});

/** 接收文件 Attachment 状态：未开始=idle(虚线) 下载中=uploading(微光) 完成=done 失败=error */
const shareAttachState = computed(() => {
  if (state.downloaded) return 'done';
  if (state.downloadFailed) return 'error';
  if (state.downloading) return 'uploading';
  return 'idle';
});

function setStatus(status, text, pulse) {
  state.status = status;
  state.statusText = text;
  state.pulse = pulse;
}

function formatSize(n) {
  if (!n) return '';
  if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n > 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}

let client = null;
let selfId = '';
let wsRef = null; // SDK WebSocketClient（二进制推流用）

/* ---------- 二进制端到端传输（帧协议与 mira-client binaryTransfer.ts 一致） ----------
 * client→server: [0x4D][u16 targetLen][target][u16 shareIdLen][shareId][u8 flags][u32 seq][payload]
 * server→接收端: 剥掉 target 段原样转发。flags bit0=eos。多文件按 files 顺序串行拼流。 */
const CHUNK_SIZE = 256 * 1024;
const BACKLOG_LIMIT = 8 * 1024 * 1024;
const ACCEPT_TIMEOUT_MS = 60000;
const RECV_STALL_MS = 30000;

function buildFrame(target, shareId, seq, flags, payload) {
  const enc = new TextEncoder();
  const t = enc.encode(target), s = enc.encode(shareId);
  const frame = new Uint8Array(1 + 2 + t.length + 2 + s.length + 1 + 4 + 4 + payload.length);
  let o = 0;
  frame[o++] = 0x4d;
  frame[o++] = (t.length >> 8) & 0xff; frame[o++] = t.length & 0xff; frame.set(t, o); o += t.length;
  frame[o++] = (s.length >> 8) & 0xff; frame[o++] = s.length & 0xff; frame.set(s, o); o += s.length;
  frame[o++] = flags;
  frame[o++] = (seq >>> 24) & 0xff; frame[o++] = (seq >>> 16) & 0xff; frame[o++] = (seq >>> 8) & 0xff; frame[o++] = seq & 0xff;
  const n = payload.length;
  frame[o++] = (n >>> 24) & 0xff; frame[o++] = (n >>> 16) & 0xff; frame[o++] = (n >>> 8) & 0xff; frame[o++] = n & 0xff;
  frame.set(payload, o);
  return frame;
}

function parseFrame(data) {
  const u8 = data instanceof Uint8Array ? data : new Uint8Array(data);
  try {
    if (u8.length < 9) return null;
    const idLen = (u8[0] << 8) | u8[1];
    if (idLen === 0 || u8.length < 2 + idLen + 9) return null;
    const shareId = new TextDecoder().decode(u8.subarray(2, 2 + idLen));
    let o = 2 + idLen;
    const flags = u8[o++];
    o += 4; // seq（WS 有序，不需要）
    const pLen = (((u8[o] << 24) | (u8[o + 1] << 16) | (u8[o + 2] << 8) | u8[o + 3]) >>> 0); o += 4;
    return { shareId, flags, payload: u8.subarray(o, o + pLen) };
  } catch { return null; }
}

/** 发送流控：WS 待发送缓冲超限时等排空 */
async function drainBacklog() {
  while (wsRef && wsRef.bufferedAmount > BACKLOG_LIMIT) {
    await new Promise(r => setTimeout(r, 30));
  }
}

// 发送会话：等待接收端 accept 的挂起 resolver（shareId → resolve）
const acceptWaiters = new Map();
// 接收会话：shareId → { files, total, received, chunks, lastActivity, onProgress, stallTimer }
const recvSessions = new Map();

/** WS 二进制帧回调（SDK ws.on('binary')）：分发给接收会话 */
function handleBinaryFrame(data) {
  const frame = parseFrame(data);
  if (!frame) return;
  const s = recvSessions.get(frame.shareId);
  if (!s) return;
  s.lastActivity = Date.now();
  if (frame.flags & 1) { finishRecvSession(s, null); return; }
  if (frame.payload.length > 0) {
    s.chunks.push(frame.payload);
    s.received += frame.payload.length;
    if (s.total > 0) s.onProgress(Math.min(1, s.received / s.total));
  }
}

function finishRecvSession(s, err) {
  if (!recvSessions.has(s.shareId)) return;
  recvSessions.delete(s.shareId);
  clearInterval(s.stallTimer);
  if (err) { s.reject(err); return; }
  try { s.resolve(saveExtracted(s)); } catch (e) { s.reject(e); }
}

/** 按 files[].size 顺序切分字节流，逐文件保存到浏览器下载目录 */
function saveExtracted(s) {
  const saved = [];
  let offset = 0;
  for (const f of s.files) {
    const bytes = sliceChunks(s.chunks, offset, f.size || 0);
    offset += f.size || 0;
    const name = (f.name || 'mira-file').replace(/[\\/:*?"<>|]/g, '_');
    saveBlob(new Blob([bytes]), name);
    saved.push(name);
  }
  return saved;
}

/** 从 chunks 流中提取 [start, start+length) 的字节（跨 chunk 拼装单文件） */
function sliceChunks(chunks, start, length) {
  const out = new Uint8Array(length);
  let written = 0, cursor = 0;
  for (const chunk of chunks) {
    const chunkEnd = cursor + chunk.length;
    if (chunkEnd <= start) { cursor = chunkEnd; continue; }
    const from = Math.max(start, cursor), to = Math.min(start + length, chunkEnd);
    if (to > from) {
      out.set(chunk.subarray(from - cursor, to - cursor), written);
      written += to - from;
      if (written >= length) break;
    }
    cursor = chunkEnd;
  }
  return out;
}

/**
 * 接收二进制分享：回 accept 后被动收流，收满按 files[].size 切分保存。
 * 返回 Promise<savedNames>。
 */
function receiveBinaryShare(msg, files, onProgress) {
  return new Promise((resolve, reject) => {
    const total = files.reduce((s, f) => s + (f.size || 0), 0);
    const shareId = msg.id;
    if (!shareId || total === 0) { reject(new Error('empty binary share')); return; }
    const s = {
      shareId, files, total, received: 0, chunks: [], lastActivity: Date.now(),
      onProgress, resolve, reject,
      stallTimer: setInterval(() => {
        if (Date.now() - s.lastActivity > RECV_STALL_MS) finishRecvSession(s, new Error(t('stallTimeout')));
      }, 3000),
    };
    recvSessions.set(shareId, s);
    client.devices().sendMessage(msg.from, msg.libraryId || libraryId, {
      type: 'mira-share-accept', shareId,
    }).catch(() => {});
  });
}

if (!token || !libraryId || !wsUrlParam) {
  setStatus('err', t('paramMissing'), false);
} else {
  main().catch((err) => {
    console.error(err);
    setStatus('err', t('connFailed', { msg: err?.message || err }), false);
  });
}

async function main() {
  // 静态页与 API 同源部署，直接用当前 origin 作为服务地址
  client = new MiraClient(location.origin);
  client.setToken(token);

  // token 认证验证（失败会抛 401）
  const info = await client.system().getSystemInfo();

  // 验证素材库存在（无效 libraryId 时设备列表/上传接口都会 404，提前给出明确提示）
  try {
    await client.devices().getByLibrary(libraryId);
  } catch (err) {
    if (err?.status === 404) throw new Error(t('libraryNotFound', { id: libraryId }));
    throw err;
  }

  // 稳定 clientId：持久化到 localStorage，刷新/重开后用相同 id 重连（server 对同 id 重连会顶替旧连接）。
  // 发送端的传输记录按 clientId 记忆目标设备，id 稳定后「重新发送」才不会 Device not found
  const SELF_ID_KEY = 'mira-pair-client-id';
  selfId = localStorage.getItem(SELF_ID_KEY) || `pair_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
  localStorage.setItem(SELF_ID_KEY, selfId);
  state.selfId = selfId;
  const ws = client.websocket(0, {
    url: wsUrlParam,
    clientId: selfId,
    libraryId,
    token,
  });
  // SDK 的 websocket() 构造后需要 start() 建立连接
  await ws.start();
  wsRef = ws;
  setStatus('ok', t('connected', { v: info?.data?.version || info?.version || 'ok' }), true);

  ws.on('disconnected', () => {
    if (!state.share) setStatus('err', t('disconnected'), false);
    wsRef = null;
  });

  // 二进制帧（对端推流）：分发给接收会话
  ws.on('binary', handleBinaryFrame);

  // 设备消息通过 eventName=admin_message 下发，message 体在 data.message
  ws.bind('admin_message', (data) => {
    const msg = data?.message || data;
    if (msg?.type === 'mira-share') renderShare(msg);
    // 接收端确认二进制分享：唤醒挂起的发送流程开始推流
    else if (msg?.type === 'mira-share-accept' && msg.shareId) {
      const waiter = acceptWaiters.get(msg.shareId);
      if (waiter) waiter();
    }
    // 发送侧终态回执：更新发送状态文案
    else if (msg?.type === 'mira-share-ack' && msg.shareId) {
      if (msg.state === 'done' && !state.sending) state.send.text = t('transferDone');
    }
  });
}

function renderShare(msg) {
  state.share = { ...msg, files: msg.files || [] };
  activeTab.value = 'receive';
  setStatus('ok', t('incomingFrom', { from: msg.fromLabel || msg.from || '?' }), false);
}

/** URL 部分下载：票据优先 → 单文件直链 → 多文件服务端 ZIP 打包 */
async function downloadUrlFiles(msg, urlFiles, onP) {
  if (msg.ticketUrl) {
    const blob = await fetchBlob(reachableUrl(msg.ticketUrl), onP);
    saveBlob(blob, urlFiles.length === 1 ? (urlFiles[0].name || 'mira-file') : `mira-share-${Date.now()}.zip`);
    return;
  }
  if (urlFiles.length === 1 && urlFiles[0].url) {
    const blob = await fetchBlob(reachableUrl(urlFiles[0].url), onP);
    saveBlob(blob, urlFiles[0].name || 'mira-file');
    return;
  }
  // 多文件：服务端 ZIP 打包（POST /api/fs/download，走 Authorization 认证）
  // ids 优先（服务端权威解析）；paths 兜底（反向发送场景上传返回的是绝对路径）
  const paths = urlFiles.map((f) => f.path).filter(Boolean);
  const ids = urlFiles.map((f) => f.id).filter(Boolean);
  const blob = await fetchBlobWithBody(`${location.origin}/api/fs/download`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ libraryId: msg.libraryId || libraryId, ids, paths }),
  }, onP);
  saveBlob(blob, `mira-share-${Date.now()}.zip`);
}

async function downloadShare() {
  const msg = state.share;
  const files = msg?.files || [];
  if (!client || files.length === 0 || state.downloading) return;

  // 回传接收进度/状态给发送端（mira-share-ack；简单节流：变化 <5% 不发，终态必发）
  let lastAckP = -1;
  const sendAck = (ackState, p = 0) => {
    if (!client || !msg?.from || !msg?.id) return;
    if (ackState === 'receiving') {
      if (p - lastAckP < 0.05 && p < 1) return;
      lastAckP = p;
    }
    client.devices().sendMessage(msg.from, msg.libraryId || libraryId, {
      type: 'mira-share-ack',
      shareId: msg.id,
      state: ackState,
      percent: p,
    }).catch(() => {});
  };

  state.downloading = true;
  state.downloaded = false;
  state.downloadFailed = false;
  state.dl = { showBar: true, percent: 0, text: '', error: false };
  const setProgress = (p, text) => {
    state.dl.percent = Math.round(p * 100);
    if (text) state.dl.text = text;
    sendAck('receiving', p);
  };
  try {
    const binaryFiles = files.filter((f) => f.binary);
    const urlFiles = files.filter((f) => !f.binary);

    if (binaryFiles.length > 0) {
      // 混合分享：URL 部分（票据/直链）与二进制推流并行接收，进度按总字节数合并
      const totalBytes = files.reduce((s, f) => s + (f.size || 0), 0) || 1;
      const urlBytes = urlFiles.reduce((s, f) => s + (f.size || 0), 0);
      const binBytes = binaryFiles.reduce((s, f) => s + (f.size || 0), 0);
      let urlP = urlBytes === 0 ? 1 : 0, binP = 0;
      const merged = () => setProgress((urlBytes * urlP + binBytes * binP) / totalBytes);
      const tasks = [];
      if (urlFiles.length > 0) {
        tasks.push(downloadUrlFiles(msg, urlFiles, (p) => { urlP = p; merged(); }));
      }
      tasks.push(receiveBinaryShare(msg, binaryFiles, (p) => { binP = p; merged(); }));
      await Promise.all(tasks);
    } else {
      await downloadUrlFiles(msg, urlFiles, setProgress);
    }
    setProgress(1, t('downloadDone'));
    state.downloaded = true;
    sendAck('done', 1);
  } catch (err) {
    console.error(err);
    setProgress(0, t('downloadFailed', { msg: err?.message || err }));
    state.downloadFailed = true;
    state.dl.error = true;
    sendAck('failed');
  } finally {
    state.downloading = false;
  }
}

// 消息中的链接是发送端视角（可能是 127.0.0.1），替换成当前页面主机保证可达
function reachableUrl(url) {
  try {
    const parsed = new URL(url, location.origin);
    parsed.protocol = location.protocol === 'https:' ? 'https:' : parsed.protocol;
    parsed.host = location.host;
    return parsed.toString();
  } catch {
    return url;
  }
}

/**
 * 二进制端到端发送（Dropzone 暂存文件 → 对端确认 → WS 推流，不经服务器存储）。
 * 文件对象发送后不可复用（无法重发），失败需重新选择。
 */
async function sendFiles() {
  const target = selectedDevice.value;
  const files = stagedFiles.value;
  if (!files || files.length === 0 || !client || !target || state.sending) return;
  const shareId = `share_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  state.sending = true;
  state.send = { showBar: true, percent: 0, text: t('sendingBtn'), error: false };
  try {
    await client.devices().sendMessage(target, libraryId, {
      type: 'mira-share',
      id: shareId,
      from: selfId,
      fromLabel: /Android|iPhone|iPad/i.test(navigator.userAgent) ? t('pairPhone') : t('pairBrowser'),
      libraryId,
      binary: true,
      files: files.map((f, i) => ({ id: `local_${Date.now()}_${i}`, name: f.name, size: f.size, url: '', binary: true })),
    });

    // 等接收端确认（mira-share-accept）后开始推流
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error(t('acceptTimeout'))), ACCEPT_TIMEOUT_MS);
      acceptWaiters.set(shareId, () => { clearTimeout(timer); resolve(); });
    });
    if (!wsRef || !wsRef.isConnectedStatus()) throw new Error(t('connLost'));

    const totalBytes = files.reduce((s, f) => s + f.size, 0) || 1;
    let sent = 0, seq = 0;
    for (const file of files) {
      for (let pos = 0; pos < file.size; pos += CHUNK_SIZE) {
        if (!wsRef || !wsRef.isConnectedStatus()) throw new Error(t('connLost'));
        const buf = new Uint8Array(await file.slice(pos, pos + CHUNK_SIZE).arrayBuffer());
        wsRef.sendBinary(buildFrame(target, shareId, seq++, 0, buf));
        sent += buf.length;
        state.send.percent = Math.round((sent / totalBytes) * 100);
        await drainBacklog();
      }
    }
    // 流结束帧：接收端以此与总字节数双保险判断完成
    wsRef.sendBinary(buildFrame(target, shareId, seq, 1, new Uint8Array(0)));
    state.send.percent = 100;
    state.send.text = t('sent', { n: files.length });
    stagedFiles.value = [];
  } catch (err) {
    console.error(err);
    state.send.text = t('sendFailed', { msg: err?.message || err });
    state.send.error = true;
  } finally {
    state.sending = false;
    acceptWaiters.delete(shareId);
  }
}

function fetchBlob(url, onProgress) {
  return fetchBlobWithBody(url, {}, onProgress);
}

function fetchBlobWithBody(url, init, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open(init.method || 'GET', url);
    for (const [k, v] of Object.entries(init.headers || {})) xhr.setRequestHeader(k, v);
    xhr.responseType = 'blob';
    xhr.onprogress = (e) => { if (e.lengthComputable) onProgress?.(e.loaded / e.total); };
    xhr.onload = () => xhr.status >= 200 && xhr.status < 300
      ? resolve(xhr.response)
      : reject(new Error('HTTP ' + xhr.status));
    xhr.onerror = () => reject(new Error('network error'));
    xhr.send(init.body || null);
  });
}

function saveBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}
