<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Mira 素材库</title>
    <!-- 远程素材库缩略图/接口需要放开 http;CEP 以 file:// 加载 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: file: http: https:" />
    <script>
      // CEP 黑屏排查:把未捕获错误直接显示在面板底部(远程调试不可用时也能看到原因)
      ;(function () {
        function show(msg) {
          var box = document.getElementById('cep-errors')
          if (!box) {
            box = document.createElement('div')
            box.id = 'cep-errors'
            box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;z-index:2147483647;background:#7f1d1d;color:#fecaca;font:11px/1.6 Consolas,monospace;padding:6px 10px;white-space:pre-wrap;word-break:break-all'
            ;(document.body || document.documentElement).appendChild(box)
            var title = document.createElement('div')
            title.style.cssText = 'font-weight:700;margin-bottom:2px'
            title.textContent = '面板脚本错误(排查后可刷新):'
            box.appendChild(title)
          }
          var line = document.createElement('div')
          line.textContent = msg
          box.appendChild(line)
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'Error') + '  @  ' + (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0))
        })
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason
          show('UnhandledRejection: ' + ((reason && (reason.message || reason.stack)) || String(reason)))
        })
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Adobe 官方 CEP 桥接库(public/js 下,产物直接同路径可用);面板以暗色主题运行 -->
    <script src="./js/CSInterface.js"></script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
