<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mira 全局搜索</title>
  <!-- 本地 Vue（与通知窗口共用） -->
  <script src="vendor/vue.global.prod.js"></script>
  <!-- 通用浮动窗口脚手架 -->
  <script src="floating-window-core.js"></script>
  <style>
    /* Material Icons - 本地字体 */
    @font-face {
      font-family: 'Material Icons';
      font-style: normal;
      font-weight: 400;
      src: url('../../assets/fonts/material-icons.ttf') format('truetype');
    }

    .material-icons {
      font-family: 'Material Icons';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== 主题变量 ========== */
    :root {
      --sw-bg-primary: #1f2937;
      --sw-bg-secondary: #374151;
      --sw-bg-tertiary: #4b5563;
      --sw-bg-selected: #3b82f6;
      --sw-text-primary: #f3f4f6;
      --sw-text-secondary: #d1d5db;
      --sw-text-tertiary: #9ca3af;
      --sw-text-muted: #6b7280;
      --sw-text-selected: #ffffff;
      --sw-text-selected-sub: #e5e7eb;
      --sw-border: #374151;
      --sw-accent: #3b82f6;
      --sw-drag-bg: rgba(255, 255, 255, 0.03);
      --sw-drag-bg-hover: rgba(255, 255, 255, 0.08);
      --sw-drag-bg-active: rgba(255, 255, 255, 0.12);
      --sw-drag-border: rgba(255, 255, 255, 0.05);
      --sw-drag-indicator: rgba(255, 255, 255, 0.3);
      --sw-drag-indicator-hover: rgba(255, 255, 255, 0.5);
      --sw-drag-indicator-active: rgba(255, 255, 255, 0.7);
      --sw-spinner-track: #374151;
      --sw-spinner-accent: #3b82f6;
    }

    :root.light {
      --sw-bg-primary: #ffffff;
      --sw-bg-secondary: #f3f4f6;
      --sw-bg-tertiary: #e5e7eb;
      --sw-bg-selected: #3b82f6;
      --sw-text-primary: #111827;
      --sw-text-secondary: #374151;
      --sw-text-tertiary: #6b7280;
      --sw-text-muted: #9ca3af;
      --sw-text-selected: #ffffff;
      --sw-text-selected-sub: #e5e7eb;
      --sw-border: #e5e7eb;
      --sw-accent: #3b82f6;
      --sw-drag-bg: rgba(0, 0, 0, 0.03);
      --sw-drag-bg-hover: rgba(0, 0, 0, 0.06);
      --sw-drag-bg-active: rgba(0, 0, 0, 0.1);
      --sw-drag-border: rgba(0, 0, 0, 0.06);
      --sw-drag-indicator: rgba(0, 0, 0, 0.2);
      --sw-drag-indicator-hover: rgba(0, 0, 0, 0.35);
      --sw-drag-indicator-active: rgba(0, 0, 0, 0.5);
      --sw-spinner-track: #e5e7eb;
      --sw-spinner-accent: #3b82f6;
    }

    @media (prefers-color-scheme: light) {
      :root:not(.dark):not(.light) {
        --sw-bg-primary: #ffffff;
        --sw-bg-secondary: #f3f4f6;
        --sw-bg-tertiary: #e5e7eb;
        --sw-bg-selected: #3b82f6;
        --sw-text-primary: #111827;
        --sw-text-secondary: #374151;
        --sw-text-tertiary: #6b7280;
        --sw-text-muted: #9ca3af;
        --sw-text-selected: #ffffff;
        --sw-text-selected-sub: #e5e7eb;
        --sw-border: #e5e7eb;
        --sw-accent: #3b82f6;
        --sw-drag-bg: rgba(0, 0, 0, 0.03);
        --sw-drag-bg-hover: rgba(0, 0, 0, 0.06);
        --sw-drag-bg-active: rgba(0, 0, 0, 0.1);
        --sw-drag-border: rgba(0, 0, 0, 0.06);
        --sw-drag-indicator: rgba(0, 0, 0, 0.2);
        --sw-drag-indicator-hover: rgba(0, 0, 0, 0.35);
        --sw-drag-indicator-active: rgba(0, 0, 0, 0.5);
        --sw-spinner-track: #e5e7eb;
        --sw-spinner-accent: #3b82f6;
      }
    }

    /* ========== 基础样式 ========== */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: transparent;
      color: var(--sw-text-primary);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    #search-app {
      width: 100vw;
      height: 100vh;
      background: transparent;
    }

    .search-window-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    .drag-handle {
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: move;
      background: var(--sw-drag-bg);
      backdrop-filter: blur(10px);
      -webkit-app-region: drag;
      user-select: none;
      flex-shrink: 0;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      border-bottom: 1px solid var(--sw-drag-border);
      transition: all 0.2s ease;
    }

    .drag-handle:hover {
      background: var(--sw-drag-bg-hover);
    }

    .drag-handle:active {
      background: var(--sw-drag-bg-active);
    }

    .drag-indicator {
      width: 36px;
      height: 3px;
      background: var(--sw-drag-indicator);
      border-radius: 2px;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .drag-handle:hover .drag-indicator {
      background: var(--sw-drag-indicator-hover);
      width: 48px;
      height: 4px;
    }

    .drag-handle:active .drag-indicator {
      background: var(--sw-drag-indicator-active);
      width: 52px;
    }

    .search-content {
      flex: 1;
      overflow: hidden;
      background: transparent;
    }

    .search-dialog {
      background: var(--sw-bg-primary);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .search-header {
      padding: 16px;
      border-bottom: 1px solid var(--sw-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--sw-bg-primary);
    }

    .search-input-container {
      display: flex;
      align-items: center;
      flex: 1;
    }

    .search-icon {
      color: var(--sw-text-tertiary);
      margin-right: 8px;
    }

    .search-input {
      background: transparent;
      color: var(--sw-text-secondary);
      width: 100%;
      outline: none;
      border: none;
      font-size: 16px;
      font-family: inherit;
      user-select: text;
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
    }

    .search-input::placeholder {
      color: var(--sw-text-muted);
    }

    .close-button {
      color: var(--sw-text-tertiary);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
      margin-left: 12px;
    }

    .close-button:hover {
      color: var(--sw-text-secondary);
      background: var(--sw-bg-secondary);
    }

    .header-loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--sw-text-tertiary);
      font-size: 12px;
      margin-right: 8px;
    }

    .header-loading-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--sw-spinner-track);
      border-top: 2px solid var(--sw-spinner-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .search-tabs {
      padding: 16px;
      display: flex;
      gap: 8px;
      background: var(--sw-bg-primary);
    }

    .tab-button {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: var(--sw-bg-secondary);
      color: var(--sw-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }

    .tab-button.active {
      background: var(--sw-bg-tertiary);
      color: var(--sw-text-selected);
    }

    .tab-button:hover {
      background: var(--sw-bg-tertiary);
    }

    .tab-icon {
      font-size: 16px;
      margin-right: 4px;
    }

    .search-results {
      flex: 1;
      padding: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--sw-bg-primary);
    }

    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      color: var(--sw-text-tertiary);
      gap: 8px;
    }

    .loading-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--sw-spinner-track);
      border-top: 2px solid var(--sw-spinner-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .results-list {
      flex: 1;
      overflow-y: auto;
      background: var(--sw-bg-secondary);
      border-radius: 8px;
      padding: 4px;
    }

    .result-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-bottom: 2px;
    }

    .result-item:hover {
      background: var(--sw-bg-tertiary);
    }

    .result-item.selected {
      background: var(--sw-bg-selected);
    }

    .result-item.selected .result-title {
      color: var(--sw-text-selected);
    }

    .result-item.selected .result-path {
      color: var(--sw-text-selected-sub);
    }

    .result-icon {
      color: var(--sw-text-tertiary);
      margin-right: 12px;
      font-size: 20px;
      flex-shrink: 0;
    }

    .result-thumbnail {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      margin-right: 12px;
      flex-shrink: 0;
      object-fit: cover;
      background: var(--sw-bg-tertiary);
    }

    .result-content {
      flex: 1;
      min-width: 0;
    }

    .result-title {
      color: var(--sw-text-secondary);
      font-weight: 500;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-path {
      color: var(--sw-text-tertiary);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .meta-item {
      color: var(--sw-text-muted);
      font-size: 11px;
      background: var(--sw-bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 2px;
    }

    .empty-state, .initial-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--sw-text-tertiary);
    }

    .empty-icon, .initial-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
      opacity: 0.5;
    }

    .empty-title, .initial-title {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--sw-text-secondary);
    }

    .empty-subtitle, .initial-subtitle {
      font-size: 14px;
      margin: 0;
    }

    .search-footer {
      padding: 16px;
      border-top: 1px solid var(--sw-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--sw-text-tertiary);
      background: var(--sw-bg-primary);
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--sw-text-tertiary);
      font-size: 12px;
    }

    .pagination-button {
      background: var(--sw-bg-secondary);
      border: none;
      color: var(--sw-text-secondary);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 11px;
    }

    .pagination-button:hover:not(:disabled) {
      background: var(--sw-bg-tertiary);
      color: var(--sw-text-selected);
    }

    .pagination-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination-info {
      margin: 0 8px;
      color: var(--sw-text-tertiary);
    }

    .shortcuts {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .shortcut {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .shortcut kbd {
      background: var(--sw-bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 10px;
      color: var(--sw-text-secondary);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 8px;
      color: var(--sw-text-tertiary);
      background: transparent;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--sw-spinner-track);
      border-top: 2px solid var(--sw-spinner-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="search-app">
    <div class="loading">
      <div class="spinner"></div>
      <span>加载搜索界面...</span>
    </div>
  </div>

  <script src="./search-window.js"></script>
</body>
</html>
