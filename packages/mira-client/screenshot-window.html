<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mira Screenshot</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #app { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; }
    body { font-family: system-ui, sans-serif; user-select:none; }
    #shade { position:fixed; inset:0; background:rgba(0,0,0,.68); }
    #stage { position:absolute; inset:16px; overflow:hidden; }
    #source { position:absolute; pointer-events:none; object-fit:contain; }
    #canvas { position:absolute; touch-action:none; cursor:crosshair; }
    #selection { position:absolute; background:rgba(56,189,248,.12); pointer-events:none; display:none; }
    #selection span { position:absolute; left:0; top:-26px; padding:4px 7px; border-radius:4px; background:rgba(0,0,0,.78); color:#fff; font:12px system-ui; white-space:nowrap; }
    #toolbar { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); display:flex; align-items:center; gap:4px; padding:8px; border:1px solid rgba(255,255,255,.18); border-radius:9px; background:rgba(20,20,24,.94); box-shadow:0 10px 30px rgba(0,0,0,.4); }
    button, select, input[type=color] { height:32px; border:0; border-radius:5px; background:transparent; color:#e5e7eb; }
    button { min-width:32px; padding:0 8px; cursor:pointer; font-size:14px; }
    button:hover, button.active { background:#2563eb; color:#fff; }
    button:disabled { opacity:.35; cursor:not-allowed; }
    select { padding:0 5px; border:1px solid #4b5563; font-size:12px; }
    input[type=color] { width:32px; padding:3px; cursor:pointer; }
    .divider { width:1px; height:22px; margin:0 3px; background:#4b5563; }
    #busy, #error { position:fixed; inset:0; display:none; align-items:center; justify-content:center; color:#fff; font-size:14px; }
    #busy { background:rgba(0,0,0,.3); } #error { background:rgba(0,0,0,.72); }
  </style>
</head>
<body>
  <div id="app">
    <div id="shade"></div><div id="stage"><img id="source"><canvas id="canvas"></canvas><div id="selection"><span></span></div></div>
    <div id="toolbar">
      <button data-tool="select" class="active" title="选择区域">↖</button><button data-tool="pen" title="画笔">✎</button><button data-tool="mosaic" title="马赛克">M</button><button data-tool="text" title="文字">T</button><button data-tool="arrow" title="箭头">→</button><button data-tool="rect" title="矩形">□</button><button data-tool="ellipse" title="椭圆">○</button>
      <span class="divider"></span><input id="color" type="color" value="#ef4444" title="颜色"><select id="width" title="线条粗细"><option value="2">细</option><option value="4" selected>中</option><option value="8">粗</option></select>
      <button id="undo" title="撤销" disabled>↶</button><button id="redo" title="重做" disabled>↷</button><span class="divider"></span><button id="cancel" title="取消">取消</button><button id="confirm" title="完成截图">完成</button>
    </div>
    <div id="busy">正在处理截图...</div><div id="error"></div>
  </div>
  <script>
    (() => {
      const api = window.electronAPI, stage = document.querySelector('#stage'), source = document.querySelector('#source'), canvas = document.querySelector('#canvas'), ctx = canvas.getContext('2d'), selectionEl = document.querySelector('#selection'), sizeEl = selectionEl.querySelector('span'), busy = document.querySelector('#busy'), errorEl = document.querySelector('#error')
      const state = { tool:'select', color:'#ef4444', width:4, frame:{x:0,y:0,w:0,h:0}, selection:null, start:null, draft:null, commands:[], redo:[], settings:{format:'png',copyToClipboard:true} }
      const point = e => { const r=canvas.getBoundingClientRect(); return {x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top))} }
      const box = (a,b) => ({x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)})
      function syncFrame(){ if(!source.naturalWidth||!stage.clientWidth)return; const ratio=source.naturalWidth/source.naturalHeight; let w=stage.clientWidth,h=w/ratio;if(h>stage.clientHeight){h=stage.clientHeight;w=h*ratio} state.frame={x:(stage.clientWidth-w)/2,y:(stage.clientHeight-h)/2,w,h}; source.style.left=state.frame.x+'px';source.style.top=state.frame.y+'px';source.style.width=w+'px';source.style.height=h+'px';canvas.style.left=state.frame.x+'px';canvas.style.top=state.frame.y+'px';canvas.style.width=w+'px';canvas.style.height=h+'px';const dpr=devicePixelRatio||1;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);draw() }
      function updateSelection(){const s=state.selection;if(!s){selectionEl.style.display='none';return} selectionEl.style.display='block';selectionEl.style.left=(state.frame.x+s.x)+'px';selectionEl.style.top=(state.frame.y+s.y)+'px';selectionEl.style.width=s.w+'px';selectionEl.style.height=s.h+'px';sizeEl.textContent=Math.round(s.w*(source.naturalWidth/state.frame.w))+' × '+Math.round(s.h*(source.naturalWidth/state.frame.w))}
      function drawCommand(c,cmd,scale,src){ c.save();c.strokeStyle=cmd.color;c.fillStyle=cmd.color;c.lineWidth=cmd.width*scale;c.lineCap='round';c.lineJoin='round';const p=q=>({x:q.x*scale,y:q.y*scale});if(cmd.type==='pen'){c.beginPath();cmd.points.forEach((q,i)=>{q=p(q);i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y)});c.stroke()}else if(cmd.type==='mosaic'&&src){const cell=Math.max(8,cmd.width*3)*scale,ss=src.naturalWidth/state.frame.w;c.imageSmoothingEnabled=false;cmd.points.forEach(q=>{const z=p(q),sx=Math.max(0,q.x*ss-cell/2),sy=Math.max(0,q.y*ss-cell/2);c.drawImage(src,sx,sy,cell,cell,z.x-cell/2,z.y-cell/2,cell,cell)})}else if(cmd.type==='text'){const q=p(cmd.point);c.font=Math.max(14,cmd.width*5)*scale+'px sans-serif';c.fillText(cmd.text,q.x,q.y)}else{const a=p(cmd.start),b=p(cmd.end);c.beginPath();if(cmd.type==='rect')c.rect(a.x,a.y,b.x-a.x,b.y-a.y);else if(cmd.type==='ellipse')c.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.abs(b.x-a.x)/2,Math.abs(b.y-a.y)/2,0,0,Math.PI*2);else{c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);const angle=Math.atan2(b.y-a.y,b.x-a.x),head=12*scale;c.lineTo(b.x-head*Math.cos(angle-Math.PI/6),b.y-head*Math.sin(angle-Math.PI/6));c.moveTo(b.x,b.y);c.lineTo(b.x-head*Math.cos(angle+Math.PI/6),b.y-head*Math.sin(angle+Math.PI/6))}c.stroke()}c.restore() }
      function draw(){const dpr=devicePixelRatio||1;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,state.frame.w,state.frame.h);state.commands.forEach(c=>drawCommand(ctx,c,1,source));if(state.draft)drawCommand(ctx,state.draft,1,source);updateSelection();document.querySelector('#undo').disabled=!state.commands.length;document.querySelector('#redo').disabled=!state.redo.length}
      function push(c){state.commands.push(c);state.redo=[];draw()}
      function finishText(p){const text=window.prompt('输入文字');if(text)push({type:'text',point:p,text,color:state.color,width:state.width})}
      canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=point(e);if(state.tool==='text'){finishText(p);return}state.start=p;if(state.tool==='select')state.selection={...p,w:0,h:0};else if(state.tool==='pen'||state.tool==='mosaic')state.draft={type:state.tool,points:[p],color:state.color,width:state.width};else state.draft={type:state.tool,start:p,end:p,color:state.color,width:state.width};draw()})
      canvas.addEventListener('pointermove',e=>{if(!state.start)return;const p=point(e);if(state.tool==='select')state.selection=box(state.start,p);else if(state.draft&&state.draft.points)state.draft.points.push(p);else if(state.draft)state.draft.end=p;draw()})
      canvas.addEventListener('pointerup',e=>{if(!state.start)return;canvas.releasePointerCapture(e.pointerId);if(state.tool==='select'){if(!state.selection||state.selection.w<4||state.selection.h<4)state.selection=null}else if(state.draft)push(state.draft);state.start=null;state.draft=null;draw()})
      document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{state.tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));canvas.style.cursor=state.tool==='select'?'crosshair':'crosshair'}))
      document.querySelector('#color').addEventListener('input',e=>state.color=e.target.value);document.querySelector('#width').addEventListener('change',e=>state.width=Number(e.target.value))
      document.querySelector('#undo').addEventListener('click',()=>{const c=state.commands.pop();if(c)state.redo.push(c);draw()});document.querySelector('#redo').addEventListener('click',()=>{const c=state.redo.pop();if(c)state.commands.push(c);draw()})
      function close(){void api.invoke('screenshot:cancel')}
      document.querySelector('#cancel').addEventListener('click',close);document.addEventListener('contextmenu',e=>{e.preventDefault();close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();document.querySelector('#undo').click()}if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();document.querySelector('#redo').click()}})
      async function confirm(){if(!source.naturalWidth)return;busy.style.display='flex';try{const img=source,crop=state.selection||{x:0,y:0,w:state.frame.w,h:state.frame.h},scale=img.naturalWidth/state.frame.w,out=document.createElement('canvas');out.width=Math.max(1,Math.round(crop.w*scale));out.height=Math.max(1,Math.round(crop.h*scale));const c=out.getContext('2d');c.drawImage(img,crop.x*scale,crop.y*scale,crop.w*scale,crop.h*scale,0,0,out.width,out.height);c.save();c.translate(-crop.x*scale,-crop.y*scale);state.commands.forEach(cmd=>drawCommand(c,cmd,scale,img));c.restore();const format=state.settings.format,mime='image/'+(format==='jpeg'?'jpeg':format),url=out.toDataURL(mime,.92),base64=url.split(',')[1],date=new Date().toISOString().replace(/[:.]/g,'-'),pictures=await api.app.getPath('pictures'),path=(pictures||'')+'/Mira Screenshots/screenshot-'+date+'.'+format;await api.invoke('fs:writeFile',path,base64,'base64');if(state.settings.copyToClipboard)await api.invoke('clipboard:writeImage',path);const blob=await(await fetch(url)).blob();await api.invoke('screenshot:complete',{data:await blob.arrayBuffer(),name:'screenshot-'+date+'.'+format,mime})}catch(e){errorEl.textContent=e instanceof Error?e.message:'截图失败';errorEl.style.display='flex'}finally{busy.style.display='none'}}
      document.querySelector('#confirm').addEventListener('click',confirm);window.addEventListener('resize',syncFrame)
      ;(async()=>{const src=await api.invoke('screenshot:get-source'),cfg=await api.invoke('screenshot:get-settings');if(!src.success){errorEl.textContent=src.message||'无法获取屏幕内容';errorEl.style.display='flex';return}state.settings=cfg.settings||state.settings;source.onload=syncFrame;source.src=src.data})()
    })()
  </script>
</body>
</html>
