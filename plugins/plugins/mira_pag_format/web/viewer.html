<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAG 预览</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f9fb}body{display:flex;flex-direction:column}.stage{display:flex;flex:1;min-height:0;align-items:center;justify-content:center}.stage #pag{display:block;width:100%!important;height:100%!important}.bar{flex:none;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid #e3e5e7;font:12px sans-serif;color:#323339;box-sizing:border-box}button{border:0;background:none;cursor:pointer}</style></head><body><div class="stage"><canvas id="pag"></canvas></div><div class="bar"><button id="toggle">暂停</button><span id="status">加载中...</span></div><script src="core-loader.js"></script><script src="core.js"></script><script>
;(async function(){const q=new URLSearchParams(location.search),src=q.get('fileUrl'),canvas=document.querySelector('#pag'),status=document.querySelector('#status'),toggle=document.querySelector('#toggle');if(!src){status.textContent='缺少 PAG 文件地址';return}try{const core=window.__miraPagModule.exports,wasm=new URL('pag.wasm',location.href),player=new core.Core({wasmPath:wasm.href,canvas,devicePixelRatio:devicePixelRatio});const response=await fetch(src);if(!response.ok)throw Error('文件加载失败');await player.loadFile(await response.arrayBuffer());status.textContent=q.get('fileName')||'PAG';let playing=true;toggle.onclick=()=>{playing?player.pagView.pause():player.pagView.play();playing=!playing;toggle.textContent=playing?'暂停':'播放'}}catch(error){status.textContent='PAG 预览失败';parent.postMessage({type:'mira-pag-preview-error',message:error.message},'*')}})()
</script></body></html>
