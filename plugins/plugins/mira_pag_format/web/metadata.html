<!doctype html><html><head><meta charset="utf-8"><title>PAG metadata</title></head><body><script src="core-loader.js"></script><script src="core.js"></script><script>
;(async function(){try{const src=new URLSearchParams(location.search).get('fileUrl');if(!src)throw Error('Missing fileUrl');const core=window.__miraPagModule.exports,module=await core.Core.from({locateFile:()=>new URL('pag.wasm',location.href).href}),response=await fetch(src);if(!response.ok)throw Error('PAG file load failed');const file=await module.PAGFile.load(await response.arrayBuffer()),metadata={width:file.width(),height:file.height(),duration:Math.ceil(file.duration()/1e6)};document.title='MIRA_PAG:'+btoa(JSON.stringify(metadata))}catch(error){document.title='MIRA_PAG_ERROR:'+btoa(String(error&&error.stack||error))}})()
</script></body></html>
